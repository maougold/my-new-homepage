<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポップギャラリー - Page 1</title>
    <style>
        body {
            font-family: 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 30px 20px;
            background: #0f0f1a;
            color: #e0e0ff;
            background-image: 
                radial-gradient(circle at 25% 30%, rgba(120, 80, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 75% 70%, rgba(255, 80, 180, 0.08) 0%, transparent 50%);
        }
        h1 {
            text-align: center;
            font-size: 2.8em;
            margin-bottom: 8px;
            background: linear-gradient(to right, #a78bff, #ff80bf, #7dd3fc);
            -webkit-background-clip: text;
            color: transparent;
        }
        .page-info {
            text-align: center;
            font-size: 1.4em;
            margin-bottom: 40px;
            color: #b0b0ff;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .gallery a {
            display: block;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }
        .gallery a:hover {
            transform: scale(1.08) rotate(2deg);
            box-shadow: 0 15px 35px rgba(167, 139, 255, 0.3);
        }
        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .nav {
            text-align: center;
            margin: 60px 0 30px;
        }
        .nav a {
            color: #a78bff;
            font-size: 1.25em;
            margin: 0 20px;
            text-decoration: none;
        }
        .nav a:hover {
            color: #ff80bf;
            text-decoration: underline;
        }
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
            h1 { font-size: 2.2em; }
        }
    </style>
</head>
<body>
