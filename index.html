<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポップギャラリー - Page 1</title>
    <style>
        body {
            font-family: 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: #0a0a0f;
            color: #eee;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(120, 80, 255, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 80, 180, 0.06) 0%, transparent 50%);
        }
        h1 {
            text-align: center;
            font-size: 2.8em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff9af0, #7b9eff, #a78bff);
            -webkit-background-clip: text;
            color: transparent;
        }
        .view-switch {
            text-align: center;
            margin: 30px 0 50px;
        }
        .view-btn {
            display: inline-block;
            padding: 14px 32px;
            margin: 0 12px;
            font-size: 1.25em;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .btn-gallery {
            background: #a78bff;
            color: #0a0a0f;
        }
        .btn-manga {
            background: transparent;
            color: #ff9af0;
            border: 2px solid #ff9af0;
        }
        .btn-gallery:hover, .btn-manga:hover {
            transform: scale(1.08);
        }
        .page-info {
            text-align: center;
            font-size: 1.35em;
            margin-bottom: 40px;
            color: #9999ff;
        }
        .masonry {
            column-count: 4;
            column-gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 20px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.25s ease;
        }
        .masonry-item:hover {
            box-shadow: 0 10px 25px rgba(255, 50, 80, 0.4);
            outline: 4px solid #ff3366;
        }
        .masonry-item img {
            width: 100%;
            display: block;
        }
        .nav {
            text-align: center;
            margin: 60px 0 30px;
        }
        .nav a {
            color: #a78bff;
            font-size: 1.1em;
            margin: 0 15px;
            text-decoration: none;
        }

        @media (max-width: 900px) {
            .masonry { column-count: 2; }
        }
        @media (max-width: 600px) {
            .masonry { column-count: 1; }
            .view-btn { display: block; margin: 12px auto; width: 80%; text-align: center; }
        }
    </style>
</head>
<body>
    <h1>ポップギャラリー</h1>
    
    <!-- ビュー切り替えボタン -->
    <div class="view-switch">
