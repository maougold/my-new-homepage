<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Collection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: #0a0a0f;
            color: #eee;
        }
        h1 {
            text-align: center;
            font-size: 2.8em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff9af0, #7b9eff);
            -webkit-background-clip: text;
            color: transparent;
        }
        .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
        
        .masonry {
            column-count: 4;
            column-gap: 18px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 18px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .masonry-item:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 30px rgba(255,154,240,0.3);
        }
        .masonry-item img {
            width: 100%;
            display: block;
        }
        
        @media (max-width: 900px) { .masonry { column-count: 2; } }
        @media (max-width: 600px) { .masonry { column-count: 1; } }
    </style>
</head>
<body>
    <h1>My Photo Collection</h1>
    <p class="subtitle">Pinterestスタイル</p>
    
    <div class="masonry">
        <div class="masonry-item"><a href="images/photo1.jpg" target="_blank"><img src="images/photo1.jpg" alt=""></a></div>
        <div class="masonry-item"><a href="images/photo2.jpg" target="_blank"><img src="images/photo2.jpg" alt=""></a></div>
        <!-- 好きなだけ追加（高さがバラバラでも綺麗に並ぶ） -->
    </div>
</body>
</html>
