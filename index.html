<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポップギャラリー</title>
    <style>
        body {
            font-family: 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 30px 20px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: #333;
        }
        h1 {
            text-align: center;
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .subtitle {
            text-align: center;
            font-size: 1.3em;
            margin-bottom: 40px;
            color: #555;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .gallery a {
            display: block;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }
        .gallery a:hover {
            transform: scale(1.08) rotate(2deg);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .info {
            text-align: center;
            margin-top: 50px;
            font-size: 1.1em;
            color: #444;
        }

        /* スマホ対応 */
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            h1 {
                font-size: 2.3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ポップギャラリー 🎨</h1>
        <p class="subtitle">クリックで大きく見れます！</p>
        
        <div class="gallery">
