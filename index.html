<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My New Homepage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            text-align: center;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        section {
            margin-bottom: 3rem;
        }
        section h2 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }
        footer {
            background: #f5f5f5;
            color: #666;
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <header>
        <h1>My New Homepage</h1>
        <p>ようこそ！</p>
    </header>

    <main>
        <section>
            <h2>About</h2>
            <p>これはシンプルなホームページです。ここにあなたの情報を追加できます。</p>
        </section>

        <section>
            <h2>Features</h2>
            <ul>
                <li>シンプルで使いやすい</li>
                <li>レスポンシブデザイン</li>
                <li>カスタマイズ可能</li>
            </ul>
        </section>

        <section>
            <h2>Contact</h2>
            <p>お問い合わせはこちらまで。</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My New Homepage. All rights reserved.</p>
    </footer>
</body>
</html>
