<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫画ビューアー</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #eee;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            padding: 15px;
            background: #1a1a2e;
            border-bottom: 1px solid #333;
        }
        .title {
            margin: 0;
            font-size: 1.6em;
        }
        .counter {
            margin: 5px 0 0;
            font-size: 1.1em;
            color: #aaa;
        }
        .viewer {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #000;
            overflow: hidden;
        }
        .viewer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            width: 60px;
            height: 120px;
            font-size: 40px;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
        }
        .btn:hover { background: rgba(255,50,80,0.7); }
        .prev { left: 10px; }
        .next { right: 10px; }

        .footer {
            padding: 15px;
            text-align: center;
            background: #1a1a2e;
            font-size: 1em;
        }
        .nav-link {
            color: #a78bff;
            margin: 0 15px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">📖 漫画ビューアー</h1>
        <div class="counter" id="counter">1 / 20</div>
    </div>

    <div class="viewer" id="viewer">
        <button class="btn prev" id="prevBtn">‹</button>
        <img id="mainImage" src="images/photo1.jpg" alt="ページ1">
        <button class="btn next" id="nextBtn">›</button>
    </div>

    <div class="footer">
        <a href="index.html" class="nav-link">← ギャラリーに戻る</a>
    </div>

    <script>
        const images = [
            "images/photo1.jpg",
            "images/photo2.jpg",
            "images/photo3.jpg",
            "images/photo4.jpg",
            "images/photo5.jpg",
            "images/photo6.jpg",
            "images/photo7.jpg",
            "images/photo8.jpg",
            "images/photo9.jpg",
            "images/photo10.jpg",
            "images/photo11.jpg",
            "images/photo12.jpg",
            "images/photo13.jpg",
            "images/photo14.jpg",
            "images/photo15.jpg",
            "images/photo16.jpg",
            "images/photo17.jpg",
            "images/photo18.jpg",
            "images/photo19.jpg",
            "images/photo20.jpg"
        ];

        let current = 0;
        const mainImage = document.getElementById('mainImage');
        const counter = document.getElementById('counter');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        function showImage() {
            mainImage.src = images[current];
            counter.textContent = `${current + 1} / ${images.length}`;
        }

        prevBtn.addEventListener('click', () => {
            current = (current - 1 + images.length) % images.length;
            showImage();
        });

        nextBtn.addEventListener('click', () => {
            current = (current + 1) % images.length;
            showImage();
        });

        // キーボード操作（← →）
        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowLeft") prevBtn.click();
            if (e.key === "ArrowRight") nextBtn.click();
        });

        // スマホでタップ操作（左右）
        let touchStartX = 0;
        document.getElementById('viewer').addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });
        document.getElementById('viewer').addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) nextBtn.click();
            if (touchEndX > touchStartX + 50) prevBtn.click();
        });

        // 最初に表示
        showImage();
    </script>
</body>
</html>
